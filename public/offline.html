<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chart Analyzer — Offline</title>
    <meta name="theme-color" content="#0B0B0B" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b0b;
        color: #f5f5f5;
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #141414;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 28px 24px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(29, 219, 4, 0.14);
        color: #1ddb04;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.6;
        color: #9ca3af;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: none;
        border-radius: 999px;
        background: #1ddb04;
        color: #000000;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">OFFLINE MODE</span>
      <h1>Internet Connect Nahi Hai</h1>
      <p>
        Naya chart AI se analyze karne ke liye internet zaroori hai. Purani saved History aur Candle
        Patterns dekhne ke liye Home par wapas jaayein ya internet on karke Refresh karein.
      </p>
      <button type="button" onclick="window.location.href='/'">Retry / Refresh Karein</button>
    </main>
  </body>
</html>
